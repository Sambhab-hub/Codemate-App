name: CodeMate CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── 1. Backend Integration Tests ──────────────────────────────────────────────
  server-ci:
    name: Backend CI (Tests & Lint)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Integration Tests
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/codemate_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_testing_key_min_32_chars
          JWT_REFRESH_SECRET: ci_refresh_secret_testing_key_min_32_chars

  # ── 2. Frontend Build Verification ─────────────────────────────────────────────
  client-ci:
    name: Frontend CI (Build Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build React Application
        run: |
          cd client
          npm run build
